<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">MappedLabs logo concept C — Branch</title>
  <desc id="cc-desc">A branching decision route rising from a single origin to three terminal data points, implying an M.</desc>

  <!-- Concept C · BRANCH
       A decision tree read as a letterform: one origin, two decision points,
       three terminals. It carries the ranked-choice idea most literally of the
       three — but the M only appears if you are told it is there, and the thin
       branch structure collapses at favicon scale. -->

  <rect width="320" height="120" fill="#F4F2ED"/>

  <g transform="translate(28 28)" fill="none" stroke="#14181A"
     stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 60 L6 30 L20 16 L34 30 L34 60"/>
    <path d="M34 30 L48 16 L62 30 L62 60"/>
  </g>
  <g transform="translate(28 28)">
    <circle cx="20" cy="16" r="4" fill="#F4F2ED" stroke="#14181A" stroke-width="3"/>
    <circle cx="48" cy="16" r="4" fill="#C8452A"/>
    <circle cx="34" cy="30" r="3.5" fill="#14181A"/>
  </g>

  <g transform="translate(116 0)">
    <text x="0" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif"
          font-size="34" font-weight="600" letter-spacing="-0.9" fill="#14181A">MappedLabs</text>
    <text x="1" y="86" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="9" letter-spacing="2.4" fill="#14181A" opacity="0.55">CAREER INTELLIGENCE</text>
  </g>
</svg>
